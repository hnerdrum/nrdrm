name: Reusable Scaleway job deploy

on:
  workflow_call:
    inputs:
      image_name:
        required: true
        type: string
      dockerfile:
        required: true
        type: string
      context:
        required: true
        type: string
      cron_schedule:
        required: true
        type: string
      cron_timezone:
        required: true
        type: string
    secrets:
      SCALEWAY_API_KEY:
        required: true
      CONTAINER_REGISTRY_ENDPOINT:
        required: true
      JOB_ID:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
      - name: Build the Docker image
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ inputs.image_name }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
        run: docker build -f "$DOCKERFILE" -t "$CONTAINER_REGISTRY/$IMAGE_NAME:$GIT_SHA" "$CONTEXT"
      - name: Push the Docker image
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
          GIT_SHA: ${{ github.sha }}
          IMAGE_NAME: ${{ inputs.image_name }}
        run: docker push "$CONTAINER_REGISTRY/$IMAGE_NAME:$GIT_SHA"
      - name: Update Scaleway serverless job definition
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
          GIT_SHA: ${{ github.sha }}
          JOB_ID: ${{ secrets.JOB_ID }}
          SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
          IMAGE_NAME: ${{ inputs.image_name }}
          CRON_SCHEDULE: ${{ inputs.cron_schedule }}
          CRON_TIMEZONE: ${{ inputs.cron_timezone }}
          REGISTRY_BASE_URL: ${{ vars.SCALEWAY_CONTAINER_REGISTRY_BASE_URL }}
        run: |
          payload=$(jq -n \
            --arg image "$CONTAINER_REGISTRY/$IMAGE_NAME:$GIT_SHA" \
            --arg api_key "$SCALEWAY_API_KEY" \
            --arg registry "$REGISTRY_BASE_URL" \
            --arg schedule "$CRON_SCHEDULE" \
            --arg timezone "$CRON_TIMEZONE" \
            '{
              image_uri: $image,
              environment_variables: {
                SCALEWAY_API_KEY: $api_key,
                SCALEWAY_CONTAINER_REGISTRY_BASE_URL: $registry
              },
              cron_schedule: {schedule: $schedule, timezone: $timezone}
            }')
          curl --fail-with-body --request PATCH \
            --header "X-Auth-Token: $SCALEWAY_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            "https://api.scaleway.com/serverless-jobs/v1alpha1/regions/fr-par/job-definitions/$JOB_ID"
