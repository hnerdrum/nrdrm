name: Recipes

on:
  pull_request:
    paths:
      - 'server/recipes/**'
      - '.github/workflows/deploy-recipes.yml'
      - '.github/workflows/reusable-deploy-scaleway-container.yml'
  push:
    branches:
      - main
    paths:
      - 'server/recipes/**'
      - '.github/workflows/deploy-recipes.yml'
      - '.github/workflows/reusable-deploy-scaleway-container.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      STACK_ARCH: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
      - uses: haskell-actions/setup@v2
        with:
          enable-stack: true
          stack-no-global: true
          cabal-update: false
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgmp-dev libpq-dev pkg-config
      - uses: actions/cache@v4
        with:
          path: |
            ~/.stack
            server/recipes/.stack-work
            server/recipes/codegen/.stack-work
          key: stack-${{ runner.os }}-${{ hashFiles('server/recipes/stack.yaml.lock', 'server/recipes/package.yaml', 'server/recipes/codegen/package.yaml') }}
          restore-keys: |
            stack-${{ runner.os }}-
      - name: Build test dependencies
        working-directory: server/recipes
        run: stack --arch=x86_64 build --only-dependencies --test --no-run-tests --fast
      - name: just recipes test
        run: just recipes test

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-deploy-scaleway-container.yml
    with:
      image_name: nrdrm-recipes
      dockerfile: server/recipes/Dockerfile
      context: server
    secrets:
      SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
      CONTAINER_REGISTRY_ENDPOINT: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
      CONTAINER_ID: ${{ secrets.RECIPES_CONTAINER_ID }}
