name: Identity CD

on:
  pull_request:
    paths:
      - "server/identity/**"
      - ".github/workflows/deploy-identity.yml"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/identity

    steps:
      - uses: actions/checkout@v4
      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
      - name: Build the Docker image
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
          GIT_SHA: ${{ github.sha }}
        run: docker build -t $CONTAINER_REGISTRY/nrdrm-identity:$GIT_SHA .
      - name: Push the Docker Image
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
          GIT_SHA: ${{ github.sha }}
        run: docker push $CONTAINER_REGISTRY/nrdrm-identity:$GIT_SHA
