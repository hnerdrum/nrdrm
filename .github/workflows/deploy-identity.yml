name: Identity

on:
  pull_request:
    paths:
      - "server/identity/**"
      - ".github/workflows/deploy-identity.yml"
      - ".github/workflows/reusable-deploy-scaleway-container.yml"
  push:
    branches:
      - main
    paths:
      - "server/identity/**"
      - ".github/workflows/deploy-identity.yml"
      - ".github/workflows/reusable-deploy-scaleway-container.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
      - uses: dtolnay/rust-toolchain@1.86
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libpq-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/identity
      - name: just identity build
        run: just identity build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-deploy-scaleway-container.yml
    with:
      image_name: nrdrm-identity
      dockerfile: server/identity/Dockerfile
      context: server/identity
    secrets:
      SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
      CONTAINER_REGISTRY_ENDPOINT: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
      CONTAINER_ID: ${{ secrets.IDENTITY_CONTAINER_ID }}
