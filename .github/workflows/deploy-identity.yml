name: Identity

on:
  pull_request:
    paths:
      - 'server/identity/**'
      - '.github/workflows/deploy-identity.yml'
      - '.github/workflows/reusable-deploy-scaleway-container.yml'
  push:
    branches:
      - main
    paths:
      - 'server/identity/**'
      - '.github/workflows/deploy-identity.yml'
      - '.github/workflows/reusable-deploy-scaleway-container.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:alpine
        env:
          POSTGRES_USER: nrdrm
          POSTGRES_PASSWORD: nrdrm
          POSTGRES_DB: identity
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nrdrm -d identity"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
      - uses: dtolnay/rust-toolchain@1.99
      - name: Install native libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev libpq-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server/identity
      - name: just identity test
        run: just identity test

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-deploy-scaleway-container.yml
    with:
      image_name: nrdrm-identity
      dockerfile: server/identity/Dockerfile
      context: server/identity
    secrets:
      SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
      CONTAINER_REGISTRY_ENDPOINT: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
      CONTAINER_ID: ${{ secrets.IDENTITY_CONTAINER_ID }}
