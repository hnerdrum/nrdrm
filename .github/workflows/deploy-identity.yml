name: Identity backend CD

on:
  pull_request:
    paths:
      - "server/identity/**"
      - ".github/workflows/deploy-identity.yml"
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/identity

    steps:
      - uses: actions/checkout@v4
      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
      - name: Build the Docker image
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
          GIT_SHA: ${{ github.sha }}
        run: docker build -t $CONTAINER_REGISTRY/nrdrm-identity:$GIT_SHA .
      - name: Push the Docker Image
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
          GIT_SHA: ${{ github.sha }}
        run: docker push $CONTAINER_REGISTRY/nrdrm-identity:$GIT_SHA
      - name: Update Scaleway container
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
          GIT_SHA: ${{ github.sha }}
          CONTAINER_ID: ${{ secrets.IDENTITY_CONTAINER_ID }}
        run: >
          curl \
            --request PATCH \
            --header "X-Auth-Token: ${{ secrets.SCALEWAY_API_KEY }}" \
            --data "{
              \"redeploy\": true,
              \"registry_image\": \"$CONTAINER_REGISTRY/nrdrm-identity:$GIT_SHA\",
              \"environment_variables\": {
                \"BUILD_ID\": \"$GIT_SHA\",
                \"ENV\": \"${{ vars.PROD_ENV }}\"
              }
            }" \
            https://api.scaleway.com/containers/v1beta1/regions/fr-par/containers/$CONTAINER_ID
      - name: Deploy Scaleway container
        run: >
          curl \
            --request POST \
            --header "X-Auth-Token: ${{ secrets.SCALEWAY_API_KEY }}" \
            --data '{}' \
            https://api.scaleway.com/containers/v1beta1/regions/fr-par/containers/${{ secrets.IDENTITY_CONTAINER_ID }}/deploy
