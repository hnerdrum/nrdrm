name: Recipes backend CD

on:
  push:
    paths:
      - "server/recipes/**"
      - ".github/workflows/deploy-recipes-backend.yml"
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server/recipes

    steps:
      - uses: actions/checkout@v4
      - name: Login to Scaleway Container Registry
        uses: docker/login-action@v3
        with:
          username: nologin
          password: ${{ secrets.SCALEWAY_API_KEY }}
          registry: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
      - name: Build the Docker image
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
          GIT_SHA: ${{ github.sha }}
        run: docker build -t $CONTAINER_REGISTRY/nrdrm-recipes:$GIT_SHA .
      - name: Push the Docker Image
        env:
          CONTAINER_REGISTRY: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
          GIT_SHA: ${{ github.sha }}
        run: docker push $CONTAINER_REGISTRY/nrdrm-recipes:$GIT_SHA
