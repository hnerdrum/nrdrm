name: Gateway

on:
  pull_request:
    paths:
      - "server/gateway/**"
      - ".github/workflows/deploy-gateway.yml"
      - ".github/workflows/reusable-deploy-scaleway-container.yml"
  push:
    branches:
      - main
    paths:
      - "server/gateway/**"
      - ".github/workflows/deploy-gateway.yml"
      - ".github/workflows/reusable-deploy-scaleway-container.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          gleam-version: "1.19.2"
          rebar3-version: "3"
      - uses: actions/cache@v4
        with:
          path: server/gateway/build
          key: gleam-${{ runner.os }}-${{ hashFiles('server/gateway/manifest.toml') }}
          restore-keys: |
            gleam-${{ runner.os }}-
      - name: just gateway test
        run: just gateway test

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-deploy-scaleway-container.yml
    with:
      image_name: nrdrm-gateway
      dockerfile: server/gateway/Dockerfile
      context: server/gateway
      extra_environment_variables: '{"ALLOWED_ORIGINS":"${{ vars.ALLOWED_ORIGINS }}","RECIPES_URL":"${{ vars.RECIPES_URL }}","IDENTITY_URL":"${{ vars.IDENTITY_URL }}","AGENTS_URL":"${{ vars.AGENTS_URL }}"}'
    secrets:
      SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
      CONTAINER_REGISTRY_ENDPOINT: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
      CONTAINER_ID: ${{ secrets.GATEWAY_CONTAINER_ID }}
