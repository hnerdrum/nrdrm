name: Delete images job

on:
  pull_request:
    paths:
      - 'cron/delete-container-images/**'
      - '.github/workflows/deploy-delete-images-job.yml'
      - '.github/workflows/reusable-deploy-scaleway-job.yml'
  push:
    branches:
      - main
    paths:
      - 'cron/delete-container-images/**'
      - '.github/workflows/deploy-delete-images-job.yml'
      - '.github/workflows/reusable-deploy-scaleway-job.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: just@1.58.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: cron/delete-container-images/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: cron/delete-container-images
      - name: just delete-images build
        run: just delete-images build

  deploy:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reusable-deploy-scaleway-job.yml
    with:
      image_name: nrdrm-delete-images-job
      dockerfile: cron/delete-container-images/Dockerfile
      context: cron/delete-container-images
      cron_schedule: '0 2 * * 1'
      cron_timezone: Europe/Oslo
    secrets:
      SCALEWAY_API_KEY: ${{ secrets.SCALEWAY_API_KEY }}
      CONTAINER_REGISTRY_ENDPOINT: ${{ secrets.CONTAINER_REGISTRY_ENDPOINT }}
      JOB_ID: ${{ secrets.DELETE_CONTAINER_IMAGES_JOB_ID }}
