version: '3'

services:
  recipesdb:
    image: 'postgres:alpine'
    environment:
      POSTGRES_DB: 'recipes'
      POSTGRES_PASSWORD: 'nrdrm'
      POSTGRES_USER: 'nrdrm'
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nrdrm -d recipes']
      interval: 2s
      timeout: 5s
      retries: 10
  identitydb:
    image: 'postgres:alpine'
    environment:
      POSTGRES_DB: 'identity'
      POSTGRES_PASSWORD: 'nrdrm'
      POSTGRES_USER: 'nrdrm'
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nrdrm -d identity']
      interval: 2s
      timeout: 5s
      retries: 10
  agentsdb:
    image: 'postgres:alpine'
    environment:
      POSTGRES_DB: 'agents'
      POSTGRES_PASSWORD: 'nrdrm'
      POSTGRES_USER: 'nrdrm'
    ports:
      - '5436:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nrdrm -d agents']
      interval: 2s
      timeout: 5s
      retries: 10
  trainingdb:
    image: 'postgres:alpine'
    environment:
      POSTGRES_DB: 'training'
      POSTGRES_PASSWORD: 'nrdrm'
      POSTGRES_USER: 'nrdrm'
    ports:
      - '5437:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nrdrm -d training']
      interval: 2s
      timeout: 5s
      retries: 10
