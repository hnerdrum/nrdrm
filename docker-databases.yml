version: "3"

services:
  recipesdb:
    image: "postgres:alpine"
    environment:
      POSTGRES_DB: "recipes"
      POSTGRES_PASSWORD: "nrdrm"
      POSTGRES_USER: "nrdrm"
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrdrm -d recipes"]
      interval: 2s
      timeout: 5s
      retries: 10
  identitydb:
    image: "postgres:alpine"
    environment:
      POSTGRES_DB: "identity"
      POSTGRES_PASSWORD: "nrdrm"
      POSTGRES_USER: "nrdrm"
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrdrm -d identity"]
      interval: 2s
      timeout: 5s
      retries: 10
  unodb:
    image: "postgres:alpine"
    environment:
      POSTGRES_DB: "uno"
      POSTGRES_PASSWORD: "nrdrm"
      POSTGRES_USER: "nrdrm"
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nrdrm -d uno"]
      interval: 2s
      timeout: 5s
      retries: 10
