name: recipes
version: 0.1.0.0
github: "hnerdrum/nrdrm"
license: BSD3
author: "Henrik Nerdrum"
maintainer: "henrik.nerdrum@gmail.com"
copyright: "2023 Henrik Nerdrum"

extra-source-files:
  - README.md
  - CHANGELOG.md

dependencies:
  - base >= 4.7 && < 5
  - aeson
  - servant-server
  - wai
  - wai-cors
  - warp
  - postgresql-simple
  - postgresql-migration
  - resource-pool
  - mtl
  - text
  - uuid
  - time
  - containers
  - unordered-containers
  - katip
  - dotenv
  - bytestring
  - split
  - random
  - cryptonite
  - memory
  - base64-bytestring
  - bcrypt
  - hlint
  - monad-logger-aeson
  - either

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs: src
  default-extensions:
    - DataKinds
    - DuplicateRecordFields
    - NamedFieldPuns
    - OverloadedRecordDot
    - OverloadedStrings
    - QuasiQuotes
    - TemplateHaskell
    - TypeFamilies
    - TypeOperators

executables:
  server-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base
      - recipes

tests:
  recipes-test:
    main: Spec.hs
    source-dirs: test
    default-extensions:
      - DuplicateRecordFields
      - NamedFieldPuns
      - OverloadedRecordDot
      - OverloadedStrings
      - TypeApplications
      - TypeFamilies
    other-modules:
      - Schema.Widget
      - Schema.Shelf
      - Schema.ShelfBookRow
      - Schema.ShelfBookChapterRow
      - Support.Assert
      - Support.TestDb
      - Support.TestMigrations
      - ORM.OperationsSpec
      - ORM.JoinSpec
      - ORM.IncludeSpec
      - ORM.Codegen.ValidateSpec
      - ORM.Codegen.EmitSpec
      - ORM.Codegen.EmitFlatRowSpec
      - ORM.Codegen.EmitIncludeSpec
      - ORM.WidgetFixtures
      - ORM.ShelfFixtures
      - Schema.ShelfInclude
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base
      - directory
      - recipes
      - hspec
      - hspec-wai
      - hspec-wai-json
      - aeson
