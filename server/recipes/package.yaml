name: recipes
version: 0.1.0.0
github: "hnerdrum/nrdrm"
license: MIT
author: "Henrik Nerdrum"
maintainer: "henrik.nerdrum@gmail.com"
copyright: "2023 Henrik Nerdrum"

extra-source-files:
  - README.md
  - CHANGELOG.md

dependencies:
  - base >= 4.7 && < 5
  - aeson
  - servant-server
  - wai
  - wai-cors
  - warp
  - postgresql-simple
  - postgresql-migration
  - resource-pool
  - mtl
  - text
  - uuid
  - time
  - containers
  - unordered-containers
  - katip
  - load-env
  - bytestring
  - split
  - random
  - cryptonite
  - memory
  - base64-bytestring
  - bcrypt
  - monad-logger-aeson
  - either
  - directory
  - filepath
  - poppy == 1.0.0

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs:
    - src
    - .poppy
  exposed-modules:
    - API.Errors
    - API.Health
    - API.Ingredient
    - API.Recipe
    - API.Server
    - API.Utils
    - App
    - Config
    - Database.Migrations
    - Domain.Errors
    - Domain.Health
    - Domain.Ingredient
    - Domain.Recipe
    - Domain.Unit
    - Lib
    - Logger
  default-extensions:
    - DataKinds
    - DuplicateRecordFields
    - NamedFieldPuns
    - OverloadedRecordDot
    - OverloadedStrings
    - QuasiQuotes
    - TemplateHaskell
    - TypeFamilies
    - TypeOperators

executables:
  server-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base
      - recipes

tests:
  recipes-test:
    main: Spec.hs
    source-dirs: test
    default-extensions:
      - OverloadedRecordDot
      - OverloadedStrings
    other-modules:
      - Domain.RecipeSpec
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base
      - recipes
      - hspec
      - aeson
