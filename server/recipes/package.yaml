name: recipes
version: 0.1.0.0
github: "hnerdrum/nrdrm"
license: BSD3
author: "Henrik Nerdrum"
maintainer: "henrik.nerdrum@gmail.com"
copyright: "2023 Henrik Nerdrum"

extra-source-files:
  - README.md
  - CHANGELOG.md

dependencies:
  - base >= 4.7 && < 5
  - aeson
  - servant-server
  - wai
  - wai-cors
  - warp
  - postgresql-simple
  - postgresql-migration
  - resource-pool
  - mtl
  - text
  - uuid
  - time
  - containers
  - unordered-containers
  - katip
  - dotenv
  - bytestring
  - split
  - random
  - cryptonite
  - memory
  - base64-bytestring
  - bcrypt
  - hlint
  - monad-logger-aeson
  - either
  - directory
  - filepath

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs:
    - src
    - .orm-gen
  exposed-modules:
    - API.Errors
    - API.Health
    - API.Ingredient
    - API.Recipe
    - API.Server
    - API.Utils
    - App
    - Config
    - Database.Migrations
    - Domain.Errors
    - Domain.Health
    - Domain.Ingredient
    - Domain.Recipe
    - Domain.Unit
    - Lib
    - Logger
    - ORM
    - ORM.Client.Ingredient
    - ORM.Client.Recipe
    - ORM.Schema.Ingredient
    - ORM.Schema.Recipe
    - ORM.Schema.RecipeInclude
    - ORM.Schema.RecipeIngredient
    - ORM.Schema.Unit
    - ORM.Codegen.Emit.Client
    - ORM.Codegen.Emit.FlatRow
    - ORM.Codegen.Emit.Include
    - ORM.Codegen.Emit.Nest
    - ORM.Codegen.Emit.Schema
    - ORM.Codegen.Emit.SelectIn
    - ORM.Codegen.IncludePath
    - ORM.Codegen.IR
    - ORM.Codegen.JoinAlias
    - ORM.Codegen.RecipeTarget
    - ORM.Codegen.Run
    - ORM.Codegen.Spec.Recipe
    - ORM.Codegen.Spec.Shelf
    - ORM.Codegen.Spec.ShelfDeep
    - ORM.Codegen.Spec.Widget
    - ORM.Codegen.Target
    - ORM.Codegen.Validate
    - ORM.Codegen.Drift
    - ORM.Codegen.Introspect
    - ORM.Column
    - ORM.Core
    - ORM.Db
    - ORM.Delete
    - ORM.Errors
    - ORM.Group
    - ORM.Include
    - ORM.Insert
    - ORM.JoinChain
    - ORM.Operations
    - ORM.PG
    - ORM.Query
    - ORM.Relation
    - ORM.Select
    - ORM.SelectIn
    - ORM.Sql
    - ORM.Update
    - ORM.Where
  other-modules:
    - ORM.Codegen.EmitCommon
    - ORM.Codegen.Lookup
    - ORM.Codegen.TextUtil
  default-extensions:
    - DataKinds
    - DuplicateRecordFields
    - NamedFieldPuns
    - OverloadedRecordDot
    - OverloadedStrings
    - QuasiQuotes
    - TemplateHaskell
    - TypeFamilies
    - TypeOperators

executables:
  orm-codegen:
    main: Main.hs
    source-dirs: tools/orm-codegen
    ghc-options:
      - -Wall
    dependencies:
      - base
      - recipes
      - text
  server-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base
      - recipes

tests:
  recipes-test:
    main: Spec.hs
    source-dirs: test
    default-extensions:
      - DuplicateRecordFields
      - NamedFieldPuns
      - OverloadedRecordDot
      - OverloadedStrings
      - TypeApplications
      - TypeFamilies
    other-modules:
      - Schema.Widget
      - Schema.Shelf
      - Schema.Book
      - Schema.Chapter
      - Schema.Section
      - Schema.Tag
      - Schema.ShelfInclude
      - Schema.ShelfGraphInclude
      - Schema.ShelfDeepInclude
      - Support.Assert
      - Support.TestDb
      - Support.TestMigrations
      - ORM.OperationsSpec
      - ORM.RawSpec
      - ORM.ErrorsSpec
      - ORM.GroupSpec
      - ORM.JoinSpec
      - ORM.IncludeSpec
      - ORM.WhereSpec
      - ORM.SelectSpec
      - ORM.NestedWriteSpec
      - ORM.Codegen.ValidateSpec
      - ORM.Codegen.JoinAliasSpec
      - ORM.Codegen.IncludePathSpec
      - ORM.Codegen.EmitSpec
      - ORM.Codegen.EmitFlatRowSpec
      - ORM.Codegen.EmitIncludeSpec
      - ORM.Codegen.EmitClientSpec
      - ORM.Codegen.TargetSpec
      - ORM.Codegen.DriftSpec
      - ORM.WidgetFixtures
      - ORM.ShelfFixtures
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base
      - directory
      - recipes
      - hspec
      - hspec-wai
      - hspec-wai-json
      - aeson
