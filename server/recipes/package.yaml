name: recipes
version: 0.1.0.0
github: "hnerdrum/nrdrm"
license: BSD3
author: "Henrik Nerdrum"
maintainer: "henrik.nerdrum@gmail.com"
copyright: "2023 Henrik Nerdrum"

extra-source-files:
  - README.md
  - CHANGELOG.md

dependencies:
  - base >= 4.7 && < 5
  - aeson
  - servant-server
  - wai
  - wai-cors
  - warp
  - postgresql-simple
  - postgresql-migration
  - resource-pool
  - mtl
  - text
  - uuid
  - time
  - containers
  - unordered-containers
  - katip
  - dotenv
  - bytestring
  - split
  - random
  - cryptonite
  - memory
  - base64-bytestring
  - bcrypt
  - hlint
  - monad-logger-aeson
  - either
  - directory
  - filepath
  - poppy

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wmissing-home-modules
  - -Wpartial-fields
  - -Wredundant-constraints

library:
  source-dirs:
    - src
    - .orm-gen
  exposed-modules:
    - API.Errors
    - API.Health
    - API.Ingredient
    - API.Recipe
    - API.Server
    - API.Utils
    - App
    - Config
    - Database.Migrations
    - Domain.Errors
    - Domain.Health
    - Domain.Ingredient
    - Domain.Recipe
    - Domain.Unit
    - Lib
    - Logger
    - ORM.Client.Ingredient
    - ORM.Client.Recipe
    - ORM.Client.RecipeIngredient
    - ORM.Schema.Ingredient
    - ORM.Schema.Recipe
    - ORM.Schema.RecipeInclude
    - ORM.Schema.RecipeIngredient
    - ORM.Schema.RecipeIngredientInclude
    - ORM.Schema.Unit
  default-extensions:
    - DataKinds
    - DuplicateRecordFields
    - NamedFieldPuns
    - OverloadedRecordDot
    - OverloadedStrings
    - QuasiQuotes
    - TemplateHaskell
    - TypeFamilies
    - TypeOperators

executables:
  server-exe:
    main: Main.hs
    source-dirs: app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base
      - recipes

tests:
  recipes-test:
    main: Spec.hs
    source-dirs:
      - test
      - schema
    default-extensions:
      - DuplicateRecordFields
      - NamedFieldPuns
      - OverloadedRecordDot
      - OverloadedStrings
      - TypeApplications
      - TypeFamilies
    other-modules:
      - ORM.Codegen.RecipeTarget
      - ORM.Codegen.Spec.Recipe
      - Support.Assert
      - Support.TestDb
      - Domain.RecipeSpec
      - ORM.NestedWriteSpec
      - ORM.Codegen.TargetSpec
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - base
      - directory
      - poppy
      - poppy-codegen
      - recipes
      - hspec
      - hspec-wai
      - hspec-wai-json
      - aeson
