cradle:
  multi:
    - path: "./server/recipes"
      config:
        cradle:
          stack:
            stackYaml: "./server/recipes/stack.yaml"
            components:
              - path: "./server/recipes/src"
                component: "recipes:lib"
              - path: "./server/recipes/.orm-gen"
                component: "recipes:lib"
              - path: "./server/recipes/schema"
                component: "recipes-codegen:exe:orm-codegen"
              - path: "./server/recipes/codegen"
                component: "recipes-codegen:exe:orm-codegen"
              - path: "./server/recipes/app"
                component: "recipes:exe:server-exe"
              - path: "./server/recipes/test"
                component: "recipes:test:recipes-test"
    - path: "./"
      config:
        cradle:
          none:
